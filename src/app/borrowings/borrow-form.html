<dialog #dlg class="modal" dir="rtl">
  <form class="box" novalidate (submit)="$event.preventDefault(); submit()" [formGroup]="form">
    <header class="head">
      <h3>{{ title }}</h3>
      <button type="button" class="x" (click)="close()" aria-label="إغلاق">✕</button>
    </header>

    <!-- أخطاء الباك -->
    <div *ngIf="backendErrors().length" class="error-messages" role="alert">
      <ul>
        <li *ngFor="let error of backendErrors()">{{ error }}</li>
      </ul>
    </div>

    <div class="grid">
      <!-- العضو: Typeahead -->
      <label class="field">
        <span class="label">العضو</span>

        <div class="typeahead" [class.err]="fieldHasBackendErr.memberId()">
          <input
            type="text"
            autocomplete="off"
            [formControl]="memberSearch"
            [placeholder]="selectedMember?.label || 'ابحث بالاسم أو البريد…'"
            (focus)="memberMenuOpen = true"
            (input)="memberMenuOpen = true"
            (blur)="closeMenuLater('member')"
            (keydown.enter)="pickFirst('member'); $event.preventDefault()"
            (keydown.escape)="memberMenuOpen=false"
          />
          <button type="button" class="x" *ngIf="selectedMember" (mousedown)="$event.preventDefault()" (click)="clearMember()">✕</button>

          <ul class="menu" *ngIf="memberMenuOpen">
            <li *ngIf="!(memberOptions$ | async)?.length" class="empty">لا توجد نتائج — اكتب أكثر…</li>
            <li
              *ngFor="let m of memberOptions$ | async"
              (mousedown)="$event.preventDefault()"
              (click)="pickMember(m)">
              <b>{{ m.label }}</b>
              <small *ngIf="m.sub">— {{ m.sub }}</small>
            </li>
          </ul>
        </div>
      </label>

      <!-- الكتاب: Typeahead -->
      <label class="field">
        <span class="label">الكتاب</span>

        <div class="typeahead" [class.err]="fieldHasBackendErr.bookId()">
          <input
            type="text"
            autocomplete="off"
            [formControl]="bookSearch"
            [placeholder]="selectedBook?.label || 'ابحث بالعنوان أو ISBN…'"
            (focus)="bookMenuOpen = true"
            (input)="bookMenuOpen = true"
            (blur)="closeMenuLater('book')"
            (keydown.enter)="pickFirst('book'); $event.preventDefault()"
            (keydown.escape)="bookMenuOpen=false"
          />
          <button type="button" class="x" *ngIf="selectedBook" (mousedown)="$event.preventDefault()" (click)="clearBook()">✕</button>

          <ul class="menu" *ngIf="bookMenuOpen">
            <li *ngIf="!(bookOptions$ | async)?.length" class="empty">لا توجد نتائج — اكتب أكثر…</li>
            <li
              *ngFor="let b of bookOptions$ | async"
              (mousedown)="$event.preventDefault()"
              (click)="pickBook(b)">
              <b>{{ b.label }}</b>
              <small *ngIf="b.sub">— {{ b.sub }}</small>
            </li>
          </ul>
        </div>
      </label>

      <!-- مدة الإعارة -->
      <label class="field span-2" [class.err]="fieldHasBackendErr.durationDays()">
        <span class="label">مدة الإعارة (أيام)</span>
        <div class="with-addon">
          <input type="number" formControlName="durationDays" placeholder="14" min="1" max="365" inputmode="numeric" />
          <span class="addon">يوم</span>
        </div>
        <small class="hint">المدّة المسموحة: 1–365 يوماً</small>
      </label>
    </div>

    <footer class="actions">
      <button type="button" class="ghost" (click)="close(); cancel.emit()">إلغاء</button>
      <button type="submit" class="primary attn">حفظ</button>
    </footer>
  </form>
</dialog>
